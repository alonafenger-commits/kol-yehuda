backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "he"

collections:
  - name: "content"
    label: "תוכן האתר"
    files:
      - file: "data/content.json"
        label: "תוכן ראשי"
        name: "site_content"
        fields:
          - label: "פרטי קשר"
            name: "contact"
            widget: "object"
            fields:
              - { label: "כתובת", name: "address", widget: "string" }
              - { label: "טלפון", name: "phone", widget: "string" }
              - { label: "דוא\"ל", name: "email", widget: "string" }
              - { label: "שעות מזכירות", name: "office_hours", widget: "string" }

          - label: "זמני תפילה - ימי חול"
            name: "zmanim_weekday"
            widget: "object"
            fields:
              - { label: "שחרית", name: "shacharit", widget: "string" }
              - { label: "מנחה", name: "mincha", widget: "string" }
              - { label: "ערבית", name: "arvit", widget: "string" }

          - label: "תורנים"
            name: "torani"
            widget: "list"
            fields:
              - { label: "תפקיד", name: "title", widget: "string" }
              - { label: "שם", name: "name", widget: "string" }
              - { label: "הערה", name: "note", widget: "string" }

          - label: "שמות לרפואה שלמה"
            name: "refuah_names"
            widget: "list"

          - label: "תורמים לסעודה שלישית"
            name: "seuda_sponsors"
            widget: "list"
            fields:
              - { label: "טקסט", name: "text", widget: "string" }
              - { label: "פנוי לתרומה?", name: "open", widget: "boolean", default: false }

          - label: "עדכונים"
            name: "updates"
            widget: "list"
            fields:
              - { label: "תאריך", name: "date", widget: "string" }
              - { label: "כותרת", name: "title", widget: "string" }
              - { label: "תוכן", name: "body", widget: "string" }

          - label: "שיעורי תורה קבועים"
            name: "shiurim"
            widget: "list"
            fields:
              - { label: "יום", name: "day", widget: "string" }
              - { label: "תדירות", name: "label", widget: "string" }
              - { label: "כותרת", name: "title", widget: "string" }
              - { label: "תוכן", name: "body", widget: "string" }
              - { label: "שעה", name: "time", widget: "string" }

          - label: "אירועים קרובים"
            name: "events"
            widget: "list"
            fields:
              - { label: "יום בחודש", name: "day", widget: "string" }
              - { label: "חודש", name: "month", widget: "string" }
              - { label: "כותרת", name: "title", widget: "string" }
              - { label: "תוכן", name: "body", widget: "string" }
              - { label: "שעה / הערה", name: "time", widget: "string" }
